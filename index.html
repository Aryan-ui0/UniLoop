<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniLoop - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="login-left">
        <div class="brand">UniLoop</div>
        <h1>Your hostel.<br>Your community.</h1>
        <p>Share everyday items, borrow what you need, and make hostel life easier.</p>

        <div class="login-features">
            <span>🏸 Share items</span>
            <span>🤝 Help each other</span>
            <span>🏠 Built for hostels</span>
        </div>
    </div>

    <div class="login-box">
        <div class="login-icon">🔄</div>
        <h2>Welcome back</h2>
        <p>Login to continue to UniLoop</p>

        <input type="text" id="username" placeholder="Enter your name">
        <input type="password" id="password" placeholder="Enter password">

        <button class="main-button" onclick="login()">Login</button>

        <p id="loginMessage"></p>
    </div>

    <script>
        function login() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            if (username == "" || password == "") {
                document.getElementById("loginMessage").innerText =
                    "Please fill all fields.";
            } else {
                window.location.href = "home.html";
            }
        }
    </script>

</body>
</html>
